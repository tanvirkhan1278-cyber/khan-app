<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>Khan Brothers Fashion – Accounts & Production</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khan Brothers">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@200;300;700&display=swap">
<style>
:root{
  --bg1:#f5f5f5;--bg2:#d4d4d4;--card:rgba(255,255,255,.72);--ink:#141414;--mut:#777;--soft:rgba(240,240,240,.75);
  --line:rgba(0,0,0,.08);--on:#141414;--onfg:#fff;--onbg:linear-gradient(180deg,#303030,#050505);
  --good:#1f7a3d;--bad:#b3261e;--sh:0 14px 32px rgba(0,0,0,.08);
  --gl1:rgba(255,255,255,.78);--gl2:rgba(255,255,255,.36);--glb:rgba(255,255,255,.75);
  --gi:rgba(255,255,255,.45);--gd1:rgba(78,84,96,.92);--gd2:rgba(22,24,28,.94);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#1d1d1d;--bg2:#0b0b0b;--card:rgba(36,36,40,.68);--ink:#f2f2f2;--mut:#9a9a9a;--soft:rgba(50,50,54,.6);
    --line:rgba(255,255,255,.1);--on:#f2f2f2;--onfg:#141414;--onbg:#f2f2f2;--good:#6fd08c;--bad:#ff8a80;
    --sh:0 16px 36px rgba(0,0,0,.45);--gl1:rgba(255,255,255,.16);--gl2:rgba(255,255,255,.06);
    --glb:rgba(255,255,255,.18);--gi:rgba(255,255,255,.09)
  }
}
:root[data-theme="dark"]{
  --bg1:#1d1d1d;--bg2:#0b0b0b;--card:rgba(36,36,40,.68);--ink:#f2f2f2;--mut:#9a9a9a;--soft:rgba(50,50,54,.6);
  --line:rgba(255,255,255,.1);--on:#f2f2f2;--onfg:#141414;--onbg:#f2f2f2;--good:#6fd08c;--bad:#ff8a80;
  --sh:0 16px 36px rgba(0,0,0,.45);--gl1:rgba(255,255,255,.16);--gl2:rgba(255,255,255,.06);
  --glb:rgba(255,255,255,.18);--gi:rgba(255,255,255,.09)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
@supports (overflow:clip){html,body{overflow-x:clip}}
body{
  font-family:'Inter','Hind Siliguri',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 85% -5%,var(--card),transparent 70%),linear-gradient(135deg,var(--bg1),var(--bg2));
  background-attachment:fixed
}

/* Ambient animated frosted light blobs */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(560px 440px at 15% 15%,rgba(255,122,0,.25),transparent 70%),
             radial-gradient(600px 480px at 85% 75%,rgba(90,140,225,.22),transparent 70%),
             radial-gradient(380px 320px at 50% 45%,rgba(255,106,0,.12),transparent 70%);
  background-size:130% 130%;animation:dr 16s ease-in-out infinite alternate
}
@keyframes dr{to{background-position:30% 20%}}

.shell{max-width:1040px;width:100%;min-width:0;margin:0 auto;padding:16px 14px 120px}.shell>*{min-width:0}

/* Frosted Glass Cards - with high-end glassmorphism & luminous rim */
.card{
  background:linear-gradient(145deg,var(--gl1),var(--gl2));
  border:1px solid var(--glb);
  border-radius:24px;padding:18px;
  box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.75);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  backdrop-filter:blur(24px) saturate(1.4);
  margin-bottom:14px;
  transition:transform .2s cubic-bezier(.2,.9,.25,1),box-shadow .2s
}
.card:hover{box-shadow:0 16px 38px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.85)}

.card.dk{
  background:linear-gradient(145deg,rgba(32,32,38,.92),rgba(14,14,16,.96));
  color:#fff;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 18px 45px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);
  backdrop-filter:blur(28px) saturate(1.4);
  position:relative;overflow:hidden
}
.card.dk::after{
  content:"";position:absolute;top:-45px;right:-45px;width:170px;height:170px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,122,0,.35),transparent 70%);
  pointer-events:none
}
.mut{color:var(--mut);font-size:13px}.dk .mut{color:rgba(255,255,255,.65)}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
.big{font-size:46px;font-weight:600;line-height:1.1;margin:6px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.12));
  color:#141414;border-radius:16px;padding:12px 8px;text-align:center;
  border:1px solid rgba(255,255,255,.35);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)
}
.tile b{display:block;font-size:18px;font-weight:600}.tile span{font-size:12px;color:#555}
.g2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.g2 .card{margin:0}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:14px 0}.g3 .card{margin:0;padding:16px}
.num{font-size:24px;font-weight:600}

/* Animated Smooth Buttons */
.btn,.sm,.add,.chk,.seg button,nav button{
  transition:transform .15s cubic-bezier(.2,.9,.25,1),box-shadow .2s,background .2s,filter .15s
}
.btn:hover,.sm:hover,.add:hover,.chk:hover{transform:translateY(-1.5px)}
.btn:active,.sm:active,.add:active,.chk:active{transform:scale(0.96) translateY(0)}

.add{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:90px;
  border:2px dashed var(--glb);background:var(--gi);color:var(--mut);
  cursor:pointer;font:inherit;font-size:16px;border-radius:24px;width:100%;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)
}
.add:hover{border-color:#ff7a00;color:var(--ink)}

.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{
  width:100%;border:1px solid var(--glb);background:var(--soft);color:var(--ink);
  font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;outline:none;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:border-color .15s,box-shadow .15s
}
input:focus,select:focus{
  border-color:#ff7a00;box-shadow:0 0 0 3px rgba(255,122,0,.2)
}

.seg{
  display:flex;gap:4px;background:linear-gradient(180deg,var(--gl1),var(--gl2));
  border:1px solid var(--glb);padding:6px;border-radius:999px;box-shadow:var(--sh);
  flex-wrap:wrap;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)
}
.seg button{
  border:0;background:transparent;color:var(--mut);font:inherit;font-size:15px;
  padding:10px 18px;border-radius:999px;cursor:pointer
}
.seg button.on,.btn,.pg button.on,.chk.on{
  background:linear-gradient(180deg,var(--gd1),var(--gd2));color:#fff;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 8px 18px rgba(0,0,0,.25),0 4px 14px rgba(255,106,0,.18)
}
.btn{border:0;font:inherit;font-size:16px;padding:13px 26px;border-radius:16px;cursor:pointer}
.sm{
  border:1px solid var(--glb);background:var(--gi);color:var(--ink);
  font:inherit;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)
}
.chk{
  width:42px;height:42px;border-radius:13px;border:1px solid var(--glb);
  background:var(--gi);color:var(--mut);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;flex-shrink:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)
}

.pg{
  display:flex;gap:6px;align-items:center;background:linear-gradient(180deg,var(--gl1),var(--gl2));
  border:1px solid var(--glb);padding:8px;border-radius:20px;width:max-content;max-width:100%;
  margin-top:12px;box-shadow:var(--sh);overflow-x:auto;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)
}
.pg button{
  width:40px;height:40px;border:1px solid var(--glb);border-radius:13px;
  background:var(--gi);color:var(--mut);font:inherit;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center
}
.vt{
  display:flex;gap:6px;background:linear-gradient(180deg,var(--gl1),var(--gl2));
  border:1px solid var(--glb);padding:5px;border-radius:16px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)
}
.vt button{
  width:38px;height:38px;border:0;border-radius:12px;background:transparent;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center
}
.vt button.on{background:var(--onbg);color:var(--onfg)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.lg .row{display:block;border:0;background:var(--soft);border-radius:18px;padding:14px;margin:0}
.lg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tag{display:inline-block;font-size:12px;background:var(--soft);padding:2px 10px;border-radius:999px;margin-left:6px;border:1px solid var(--line)}
.good{color:var(--good)}.bad{color:var(--bad)}.err{color:var(--bad);font-size:14px;margin-left:10px}
.empty{color:var(--mut);padding:10px 0}.tr{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sec{font-size:15px;font-weight:600;margin:16px 0 6px;color:var(--ink);display:flex;align-items:center;justify-content:space-between}

/* View transition animation */
#view > *{animation:viewSlideIn .32s cubic-bezier(.16,1,.3,1)}
@keyframes viewSlideIn{
  0%{opacity:0;transform:translateY(12px) scale(.995)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* Header Brand with High-end Frosted Glass */
.brand{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(145deg,rgba(26,26,30,.92),rgba(12,12,14,.96));
  color:#fff;border-radius:24px;padding:12px 18px;
  box-shadow:0 14px 34px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  backdrop-filter:blur(24px) saturate(1.4);
  margin:4px 0 12px;gap:12px
}
.logo{display:flex;align-items:center;gap:12px}.logo img{height:46px;width:auto;display:block}
.wm{font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;color:#fff;line-height:1}
.wm b{display:block;font-size:20px;font-weight:700;letter-spacing:.02em}
.wm i{display:block;font-style:normal;font-size:9px;font-weight:200;letter-spacing:.85em;margin-top:7px;color:#fff}

/* Header Action Controls */
.header-actions{display:flex;align-items:center;gap:10px}
.snd-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px rgba(0,0,0,.25);
  font-size:16px;user-select:none;transition:transform .15s,filter .15s
}
.snd-btn:hover{transform:scale(1.08);filter:brightness(1.2)}
.snd-btn:active{transform:scale(.92)}

/* Language Switcher - Pure Crystal Glass Capsule (NO WHITE DOTS) */
.lang-toggle-wrap{display:flex;align-items:center;flex-shrink:0}
.lang-switch{
  position:relative;width:98px;height:40px;border-radius:999px;
  background:linear-gradient(180deg,rgba(26,26,30,.92),rgba(12,12,14,.96));
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 4px 14px rgba(0,0,0,.35);
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:transform .15s cubic-bezier(.2,.9,.25,1),box-shadow .2s
}
.lang-switch:hover{
  transform:scale(1.02);box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 6px 18px rgba(255,106,0,.25)
}
.lang-switch:active{transform:scale(0.97)}
.lang-label{
  font-size:11px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.45);
  z-index:3;transition:color .3s ease,text-shadow .3s ease;pointer-events:none
}
.lang-label.active{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.8)}
.lang-glow{
  position:absolute;top:0;bottom:0;width:48px;border-radius:999px;
  background:radial-gradient(circle at center,rgba(255,122,0,.9) 0%,rgba(255,90,0,.35) 60%,transparent 100%);
  filter:blur(6px);transition:transform .38s cubic-bezier(.16,1,.3,1);
  pointer-events:none;z-index:1
}
.lang-thumb{
  position:absolute;top:3px;bottom:3px;width:46px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.12));
  border:1px solid rgba(255,255,255,.6);
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.85),0 0 14px rgba(255,122,0,.45);
  transition:transform .38s cubic-bezier(.16,1,.3,1);
  z-index:2
}
.lang-switch[data-lang="bn"] .lang-thumb,.lang-switch[data-lang="bn"] .lang-glow{transform:translateX(0)}
.lang-switch[data-lang="en"] .lang-thumb,.lang-switch[data-lang="en"] .lang-glow{transform:translateX(44px)}


/* ========================================================
   RESTORED ULTRA-LUXURY GLASSMORPHISM CALCULATOR (.cs, .cw)
   ======================================================== */
.cw{
  position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;background:rgba(0,10,24,0);
  transition:background .35s ease,backdrop-filter .35s ease,-webkit-backdrop-filter .35s ease
}
.cw.open{
  pointer-events:auto;
  background:rgba(12,22,38,.42);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);
  backdrop-filter:blur(16px) saturate(1.5)
}
.cs{
  width:min(100%,420px);border-radius:40px 40px 0 0;
  padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .42s cubic-bezier(.16,1,.3,1);color:#fff;
  background:linear-gradient(180deg,rgba(140,165,195,.42),rgba(80,105,140,.45) 50%,rgba(30,45,70,.62));
  -webkit-backdrop-filter:blur(36px) saturate(1.5);backdrop-filter:blur(36px) saturate(1.5);
  border:1px solid rgba(255,255,255,.45);border-bottom:0;
  box-shadow:0 -20px 60px rgba(10,24,55,.4),inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 35px rgba(255,255,255,.08)
}
.cw.open .cs{transform:none}
.cs.drag{transition:none}
.gr{height:34px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.gr i{width:46px;height:4px;border-radius:4px;background:#ff7a00;box-shadow:0 0 10px rgba(255,122,0,.9)}
.cd{text-align:right;padding:4px 8px 12px;cursor:pointer;-webkit-user-select:none;user-select:none}
.ex{min-height:20px;font-size:14px;color:rgba(255,255,255,.75);text-shadow:0 1px 8px rgba(0,20,60,.5)}
.dp{font-size:52px;font-weight:500;line-height:1.15;white-space:nowrap;overflow:hidden;text-shadow:0 1px 8px rgba(0,20,60,.5)}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ck button{
  height:64px;font:inherit;font-size:26px;color:#fff;border-radius:22px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.09));
  border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px rgba(0,0,0,.15);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  text-shadow:0 1px 8px rgba(0,20,60,.45);
  transition:transform .12s cubic-bezier(.2,.9,.25,1),filter .15s,background .15s
}
.ck button:hover{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.14));transform:translateY(-1.5px)}
.ck button:active{transform:scale(.92);filter:brightness(1.25)}
.ck .fn{
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.18));
  border-color:rgba(255,255,255,.4)
}
.ck .o{
  background:linear-gradient(180deg,#ff9a3c,#ff6a00);border-color:rgba(255,255,255,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(255,106,0,.45)
}
.ck .o.sel{background:#fff;color:#ff6a00}
.ck .z{grid-column:span 2;text-align:left;padding-left:26px}

/* Toast with Spring Bounce Animation */
#toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;z-index:30;
  transform:translate(-50%,-160%);padding:10px 24px;border-radius:999px;color:#fff;
  font-size:15px;font-weight:600;background:linear-gradient(180deg,#ff9a3c,#ff6a00);
  box-shadow:0 12px 30px rgba(255,106,0,.5),0 0 24px rgba(255,122,0,.3);
  transition:transform .42s cubic-bezier(.34,1.56,.64,1)
}
#toast.show{transform:translate(-50%,0)}

/* Navigation with Frosted Blur & Indicator */
nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:5;display:flex;gap:2px;padding:6px;border-radius:999px;
  background:linear-gradient(160deg,rgba(26,28,34,.78),rgba(10,12,16,.86));
  border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:0 14px 34px rgba(0,0,0,.35);max-width:calc(100% - 20px)
}
nav button{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:0;background:transparent;color:rgba(255,255,255,.55);font:inherit;font-size:11px;
  padding:8px 12px;border-radius:999px;cursor:pointer;min-width:58px
}
nav button:active{transform:scale(.92)}
nav button.on{
  color:#fff;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.14);
  animation:np .35s ease-out
}
nav button.on .ic{animation:ip .5s cubic-bezier(.3,1.6,.5,1)}
nav button.on::before{
  content:"";position:absolute;left:10%;right:10%;bottom:0;height:24px;
  background:radial-gradient(60% 100% at 50% 100%,rgba(255,106,0,.6),transparent);pointer-events:none
}
nav button.on::after{
  content:"";position:absolute;left:30%;right:30%;bottom:3px;height:3px;
  border-radius:3px;background:#ff7a00;box-shadow:0 0 10px 2px rgba(255,106,0,.9);
  pointer-events:none;animation:bar .4s ease-out
}
@media(min-width:820px){
  .shell{display:grid;grid-template-columns:200px 1fr;gap:22px;padding-bottom:40px;align-items:start}.brand{grid-column:1/-1}
  nav{position:sticky;top:16px;left:auto;bottom:auto;transform:none;flex-direction:column;border-radius:26px;padding:10px;gap:4px}
  nav button{flex-direction:row;font-size:15px;gap:10px;color:rgba(255,255,255,.8);padding:12px 14px;border-radius:16px;justify-content:flex-start}
  nav button.on{background:var(--onbg);color:var(--onfg);box-shadow:0 10px 16px rgba(0,0,0,.28)}
  nav button.on::before{left:auto;top:0;bottom:0;right:0;width:90px;height:auto;background:radial-gradient(100% 75% at 100% 50%,rgba(255,106,0,.55),transparent)}

.it{display:grid;grid-template-columns:1fr 62px 84px 40px;gap:8px;margin-bottom:8px;align-items:center}

.xr{display:grid;grid-template-columns:1fr 100px 40px;gap:8px;margin-bottom:8px;align-items:center}

.wk{
  display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;margin-bottom:10px;padding:10px;

}

function put(k,o){
  var i=-1;
  if(ed&&ed.k===k){
    D[k].forEach(function(x,j){if(x.id===ed.id)i=j});
  }
  if(i>=0){
    var old=D[k][i];
    o.id=old.id;
    if(k==='prod'){
      ['cuts','sews'].forEach(function(f){
        o[f].forEach(function(c,j){c.paid=!!(old[f]&&old[f][j]&&old[f][j].paid)});
      });
    }
    if(k==='sales'&&o.type==='cod') o.paid=Math.min(old.paid,stot(o));
    D[k][i]=o;
  } else {
    D[k].push(o);
  }
  ed=null;
}

function cK(k){
  sfx('calc');
  var c=C;
  if(c.s==='Error'&&k!=='AC') k='AC';
  if(k==='AC'){
    c.a=null;c.op=null;c.s='0';c.fresh=true;c.ex='';
  } else if(/^\d$/.test(k)){
    if(c.fresh||c.s==='0'){c.s=k;c.fresh=false}
    else if(c.s.replace(/\D/g,'').length<15) c.s+=k;
  } else if(k==='.'){
    if(c.fresh){c.s='0.';c.fresh=false}
    else if(c.s.indexOf('.')<0) c.s+='.';
  } else if(k==='<'){
    if(!c.fresh){
      c.s=c.s.length>1&&c.s!=='-0'?c.s.slice(0,-1):'0';
      if(c.s==='-')c.s='0';
    }
  } else if(k==='±'){
    if(c.s!=='0') c.s=c.s[0]==='-'?c.s.slice(1):'-'+c.s;
  } else if(k==='%'){
    c.s=String(Number((parseFloat(c.s)/100).toPrecision(12)));
    c.fresh=true;
  } else if(k==='='){
    if(c.op){
      var b=parseFloat(c.s), r=cr(c.a,c.op,b);
      c.ex=fd(String(c.a))+' '+c.op+' '+fd(String(b))+' =';
      c.s=r===null?'Error':String(r);
      c.op=null; c.a=null; c.fresh=true;
    }
  } else {
    if(c.op&&!c.fresh){
      var r2=cr(c.a,c.op,parseFloat(c.s));
      if(r2===null){c.s='Error';c.op=null;c.fresh=true;cShow();return}
      c.a=r2; c.s=String(r2);
    } else {
      c.a=parseFloat(c.s);
    }
    c.op=k; c.fresh=true;
    c.ex=fd(String(c.a))+' '+k;
  }
  cShow();
}

<script>
/* ===== Data safety: IndexedDB mirror + persistent storage + backup/restore ===== */
(function(){
  var DB='khan_db', ST='kv', KEY='data', TK=K+'_t';
  function idb(){return new Promise(function(res,rej){
    if(!window.indexedDB) return rej('no idb');
    var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(){r.result.createObjectStore(ST)};
    r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)};
  })}
  function idbGet(){return idb().then(function(db){return new Promise(function(res,rej){
    var q=db.transaction(ST).objectStore(ST).get(KEY);
    q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){rej(q.error)};
  })})}
  function idbPut(v){return idb().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction(ST,'readwrite'); tx.objectStore(ST).put(v,KEY);
    tx.oncomplete=res; tx.onerror=function(){rej(tx.error)};
  })})}
  function hasData(d){return d&&((d.sales||[]).length||(d.prod||[]).length||(d.exp||[]).length)}
  window._idbPut=idbPut;

  // save(): localStorage (instant) + IndexedDB (backup copy) with timestamp
  save=function(){
    var now=Date.now();
    try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(TK,now)}catch(e){}
    idbPut({t:now,data:D}).catch(function(){});
  };

  // Ask the browser not to auto-delete our data
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}

  // On start: if localStorage was wiped (or older), recover from IndexedDB
  idbGet().then(function(rec){
    var lt=0; try{lt=+localStorage.getItem(TK)||0}catch(e){}
    if(rec&&hasData(rec.data)&&(!hasData(D)||rec.t>lt)){
      D=rec.data; D.sales=D.sales||[];D.prod=D.prod||[];D.exp=D.exp||[];
      try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(TK,rec.t)}catch(e){}
      render(); flash(LANG==='bn'?'ডেটা পুনরুদ্ধার হয়েছে ✓':'Data restored ✓');
    } else if(hasData(D)&&!rec){ idbPut({t:Date.now(),data:D}).catch(function(){}) }
  }).catch(function(){});

  function flash(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}

  // ---- Backup / Restore panel ----
  var css=document.createElement('style');
  css.textContent='#bk_w{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:20px}'
   +'#bk_w.on{display:flex}#bk_c{width:100%;max-width:360px;background:var(--bg1);color:var(--ink);border:1px solid var(--glb);border-radius:24px;padding:20px;box-shadow:var(--sh)}'
   +'#bk_c h2{margin:0 0 6px}#bk_c button{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--glb);background:var(--soft);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}'
   +'#bk_c button.p{background:var(--on);color:var(--onfg);border:0}';
  document.head.appendChild(css);
  var w=document.createElement('div'); w.id='bk_w';
  w.innerHTML='<div id="bk_c"><h2 id="bk_h"></h2><div class="mut" id="bk_m"></div>'
   +'<button class="p" id="bk_ex"></button><button id="bk_im"></button><button id="bk_cl"></button>'
   +'<input type="file" id="bk_f" accept="application/json,.json" style="display:none"></div>';
  document.body.appendChild(w);
  function labels(){
    var bn=LANG==='bn';
    $('bk_h').textContent=bn?'ব্যাকআপ ও রিস্টোর':'Backup & Restore';
    $('bk_m').textContent=bn?'ডেটা ফোনে নিরাপদে সংরক্ষিত থাকে। তবুও মাঝে মাঝে ব্যাকআপ ফাইল নামিয়ে রাখুন।':'Data is stored safely on this device. Still, download a backup file now and then.';
    $('bk_ex').textContent=bn?'⬇ ব্যাকআপ ডাউনলোড':'⬇ Download backup';
    $('bk_im').textContent=bn?'⬆ ব্যাকআপ থেকে রিস্টোর':'⬆ Restore from backup';
    $('bk_cl').textContent=bn?'বন্ধ করুন':'Close';
  }
  window.openBackup=function(){labels();w.classList.add('on')};
  w.addEventListener('click',function(e){if(e.target===w)w.classList.remove('on')});
  $('bk_cl').onclick=function(){w.classList.remove('on')};
  $('bk_ex').onclick=function(){
    var blob=new Blob([JSON.stringify({app:'khan',v:2,exported:new Date().toISOString(),data:D},null,1)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='khan-backup-'+today()+'.json'; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  };
  $('bk_im').onclick=function(){$('bk_f').click()};
  $('bk_f').onchange=function(){
    var f=this.files[0]; this.value=''; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result), d=j.data||j;
        if(!d||!Array.isArray(d.sales)||!Array.isArray(d.prod)||!Array.isArray(d.exp)) throw 0;
        if(!confirm(LANG==='bn'?'বর্তমান ডেটা মুছে ব্যাকআপ ফাইলের ডেটা বসানো হবে। ঠিক আছে?':'This replaces current data with the backup. Continue?')) return;
        D={sales:d.sales,prod:d.prod,exp:d.exp}; save(); render(); w.classList.remove('on');
        flash(LANG==='bn'?'রিস্টোর সম্পন্ন ✓':'Restore complete ✓');
      }catch(e){alert(LANG==='bn'?'ফাইলটি সঠিক ব্যাকআপ নয়':'Not a valid backup file')}
    };
    r.readAsText(f);
  };

  // ---- Service worker ----
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
  }
})();
</script>

  function flash(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}

  function status(s){$('sb_s').textContent=s}

    $('sb_e').disabled=$('sb_p').disabled=!sb; $('sb_li').disabled=$('sb_su').disabled=!sb}

  // ---- Sync logic ----

    var t=num(TK)||Date.now(); pushing=true;

    });

<script>
/* ===== Draggable calculator button ===== */
(function(){
  var f=document.getElementById('fab'); if(!f) return;
  var S=54,M=8,pos={side:'r',y:null},drag=null;
  try{var sv=JSON.parse(localStorage.getItem('khan_fab')||'null'); if(sv&&(sv.side==='l'||sv.side==='r')) pos=sv;}catch(e){}
  function clampY(y){var top=M+(parseInt(getComputedStyle(document.documentElement).paddingTop)||0);return Math.max(top,Math.min(innerHeight-S-M,y))}
  function apply(){
    if(pos.y==null) pos.y=innerHeight-S-100;
    pos.y=clampY(pos.y);
    f.style.left=(pos.side==='l'?M:innerWidth-S-M)+'px';
    f.style.top=pos.y+'px';
  }
  f.addEventListener('pointerdown',function(e){
    drag={dx:e.clientX-f.offsetLeft,dy:e.clientY-f.offsetTop,x0:e.clientX,y0:e.clientY,moved:false};
    try{f.setPointerCapture(e.pointerId)}catch(_){}
  });
  f.addEventListener('pointermove',function(e){
    if(!drag) return;
    if(!drag.moved && Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
    drag.moved=true; f.classList.add('drag');
    f.style.left=Math.max(0,Math.min(innerWidth-S,e.clientX-drag.dx))+'px';
    f.style.top=clampY(e.clientY-drag.dy)+'px';
  });
  function end(e){
    if(!drag) return;
    var d=drag; drag=null; f.classList.remove('drag');
    if(d.moved){
      pos.side=(f.offsetLeft+S/2<innerWidth/2)?'l':'r';
      pos.y=f.offsetTop; apply();
      try{localStorage.setItem('khan_fab',JSON.stringify(pos))}catch(_){}
    } else if(e.type==='pointerup'){ openCalc(); }
  }
  f.addEventListener('pointerup',end); f.addEventListener('pointercancel',end);
  f.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openCalc()}});
  addEventListener('resize',apply); apply();
})();
